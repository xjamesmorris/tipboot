name: Publish image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image-tag:
        description: Manual OCI tag (main and latest are reserved)
        required: true
        default: manual
        type: string
  workflow_call:
    inputs:
      channel:
        description: Internal publication channel
        required: true
        type: string
      image-tag:
        description: Optional OCI tag for reusable callers
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/xjamesmorris/tipboot
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

jobs:
  publish:
    name: Publish multi-architecture image
    if: github.repository == 'xjamesmorris/tipboot'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate publication request
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          REQUESTED_TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail
          if [[ "${REQUESTED_CHANNEL}" == "main" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              printf '::error::Reusable publication is restricted to the rolling main channel.\n'
              exit 1
            fi
            exit 0
          fi

          case "${GITHUB_EVENT_NAME}" in
            push)
              semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
              if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ${semver_re} ]]; then
                printf '::error::Version tag is not valid SemVer: %s\n' \
                  "${GITHUB_REF_NAME}"
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [[ ! "${REQUESTED_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,79}$ ]]; then
                printf '::error::Manual image tag is not a valid OCI tag (max 80 characters).\n'
                exit 1
              fi
              case "${REQUESTED_TAG}" in
                main|latest)
                  printf '::error::Manual tag %s is reserved for automatic publication.\n' \
                    "${REQUESTED_TAG}"
                  exit 1
                  ;;
              esac
              ;;
            *)
              printf '::error::Unsupported publication event: %s\n' \
                  "${GITHUB_EVENT_NAME}"
              exit 1
              ;;
          esac

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.33.0
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          buildkitd-flags: --debug
          cache-binary: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OCI metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=main,priority=1000,enable=${{ inputs.channel == 'main' }}
            type=semver,pattern={{version}},priority=1000,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},priority=900,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},priority=800,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=${{ inputs.image-tag || 'manual' }},priority=1000,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=long,priority=100
          labels: |
            org.opencontainers.image.title=Tipboot
            org.opencontainers.image.description=Disposable toolchain for building and boot-smoke testing arm64 Linux kernels
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/xjamesmorris/tipboot
            org.opencontainers.image.url=https://github.com/xjamesmorris/tipboot
          annotations: |
            org.opencontainers.image.title=Tipboot
            org.opencontainers.image.description=Disposable toolchain for building and boot-smoke testing arm64 Linux kernels
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/xjamesmorris/tipboot
            org.opencontainers.image.url=https://github.com/xjamesmorris/tipboot

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

      - name: Create GitHub provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Inspect published index and attestations
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/tipboot-index.json"
          docker buildx imagetools inspect --raw \
            "${IMAGE_NAME}@${IMAGE_DIGEST}" > "${manifest}"

          jq -e '
            .annotations["org.opencontainers.image.source"]
              == "https://github.com/xjamesmorris/tipboot"
          ' "${manifest}" >/dev/null

          platforms="$(
            jq -r '
              [
                .manifests[].platform
                | select(
                    .os == "linux"
                    and (.architecture == "amd64" or .architecture == "arm64")
                  )
                | "\(.os)/\(.architecture)"
              ]
              | unique
              | sort
              | join(",")
            ' "${manifest}"
          )"
          if [[ "${platforms}" != "linux/amd64,linux/arm64" ]]; then
            printf '::error::Unexpected image platforms: %s\n' "${platforms}"
            exit 1
          fi

          jq -e '
            [
              .manifests[]
              | select(
                  .annotations["vnd.docker.reference.type"]
                    == "attestation-manifest"
                )
            ]
            | length >= 2
          ' "${manifest}" >/dev/null

      - name: Verify anonymous public pull
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          repository="${IMAGE_NAME#ghcr.io/}"
          token_json="$(
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --get \
              --data-urlencode service=ghcr.io \
              --data-urlencode "scope=repository:${repository}:pull" \
              https://ghcr.io/token
          )"
          registry_token="$(jq -er '.token // .access_token' <<< "${token_json}")"
          printf '::add-mask::%s\n' "${registry_token}"
          manifest_url="https://ghcr.io/v2/${repository}/manifests/${IMAGE_DIGEST}"
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'

          status=000
          for _ in 1 2 3 4 5 6; do
            status="$(
              curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${registry_token}" \
                --header "Accept: ${accept}" \
                "${manifest_url}"
            )"
            [[ "${status}" == "200" ]] && break
            sleep 10
          done
          unset registry_token token_json

          if [[ "${status}" != "200" ]]; then
            printf '::error::ghcr.io/xjamesmorris/tipboot is not anonymously readable (HTTP %s). Set the GHCR package visibility to public.\n' \
              "${status}"
            exit 1
          fi

          {
            printf '### Published image\n\n'
            printf -- '- Digest: `%s`\n' "${IMAGE_DIGEST}"
            printf -- '- Platforms: `linux/amd64`, `linux/arm64`\n'
            printf -- '- Anonymous pull: verified\n'
          } >> "${GITHUB_STEP_SUMMARY}"
